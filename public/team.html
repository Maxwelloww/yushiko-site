<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Команда — Miteria</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css?v=20261114-features"><script defer src="/site-shell.js?v=20261114-features"></script><script defer src="/app.js?v=20261114-features"></script></head><body data-page="team"><div class="lily-backdrop" aria-hidden="true"></div><div class="petal-field" aria-hidden="true"></div><div id="siteHeader"></div><main class="subpage section-wrap"><section class="team-section"><div class="team-art"><span class="big-lily">❋</span><span class="vertical-note">MITERIA · DISCORD</span></div><div class="team-copy"><p class="eyebrow">КОМАНДА СЕРВЕРА</p><h1>Помоги Miteria</h1><p>Ищем внимательных и дружелюбных людей, готовых поддерживать порядок и помогать участникам.</p><div class="roles"><span>Модерация</span><span>Поддержка</span><span>Организация событий</span></div></div></section><section class="apply-section" id="apply"><div class="section-heading"><p class="eyebrow">ЗАЯВКА В КОМАНДУ</p><h2>Расскажи о себе</h2><p>Администрация рассмотрит заявку и свяжется с тобой в Discord.</p></div><form id="applicationForm" class="application-form"><label>Как тебя называть?<input name="name" required maxlength="80" placeholder="Имя или ник"></label><label>Discord username<input name="discord_tag" required maxlength="100" placeholder="@username"></label><label>На какую роль?<select name="role" required><option value="">Выбери роль</option><option>Модератор</option><option>Поддержка</option><option>Организатор событий</option><option>Другая роль</option></select></label><label class="form-wide">Почему хочешь присоединиться?<textarea name="message" required maxlength="1500" rows="5" placeholder="Расскажи немного о себе"></textarea></label><div class="form-wide form-submit"><button class="button button-light" type="submit">Отправить заявку</button><p id="formMessage" class="form-message" role="status"></p></div></form></section></main><div id="siteFooter"></div></body></html>
