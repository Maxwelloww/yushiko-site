<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Найти компанию — Miteria</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css?v=20261114-aligned-headings"><script defer src="/site-shell.js?v=20261114-aligned-headings"></script><script defer src="/app.js?v=20261114-features"></script></head><body data-page="company"><div class="lily-backdrop" aria-hidden="true"></div><div class="petal-field" aria-hidden="true"></div><div id="siteHeader"></div><main class="subpage section-wrap content-section">
    <img class="page-banner section-page-banner" src="/images/section-company.jpg" alt="Найти компанию в Miteria"><div class="page-intro"><p class="eyebrow">ДОСКА СООБЩЕСТВА</p><h1>Найти компанию</h1><p>Запросы активны 12 часов. Выбери занятие или игру, чтобы найти подходящую компанию.</p></div><div class="board-filters"><label>Занятие<select id="companyActivityFilter"><option value="">Все занятия</option><option>Поиграть вместе</option><option>Посмотреть аниме</option><option>Поболтать в голосовом</option><option>Послушать музыку</option><option>Найти друзей</option></select></label><label>Игра или тема<input id="companySearch" type="search" placeholder="Например, Minecraft"></label></div><div id="companyList" class="company-grid"><p class="muted">Загружаем запросы…</p></div><form id="companyForm" class="application-form company-form"><label>Чем займёмся?<select name="activity" required><option value="">Выбери занятие</option><option>Поиграть вместе</option><option>Посмотреть аниме</option><option>Поболтать в голосовом</option><option>Послушать музыку</option><option>Найти друзей</option></select></label><label>Игра или тема<input name="game" maxlength="80" placeholder="Например, Minecraft или аниме"></label><label>Когда будешь свободен?<input name="available_at" type="datetime-local"></label><label class="form-wide">Подробности<textarea name="details" maxlength="400" rows="2" placeholder="Какой режим или что хотелось бы…"></textarea></label><div class="form-wide form-submit"><button class="button button-light" type="submit">Создать запрос</button><p id="companyMessage" class="form-message" role="status">Для публикации войди через Discord.</p></div></form></main><div id="siteFooter"></div></body></html>
