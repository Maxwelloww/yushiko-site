<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><title>Галерея — Miteria</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css?v=20261114-balanced-layout"><script defer src="/site-shell.js?v=20261114-features"></script><script defer src="/app.js?v=20261114-features"></script></head><body data-page="gallery"><div class="lily-backdrop" aria-hidden="true"></div><div class="petal-field" aria-hidden="true"></div><div id="siteHeader"></div><main class="subpage section-wrap content-section">
    <img class="page-banner section-page-banner" src="/images/section-gallery.jpg" alt="Галерея Miteria"><div class="page-intro"><p class="eyebrow">РАБОТЫ УЧАСТНИКОВ</p><h1>Галерея</h1><p>Выбери раздел или найди работу по названию и автору. Новые публикации появляются после проверки.</p></div><div class="board-filters gallery-filters"><button id="gallerySavedToggle" type="button" class="small-button" aria-pressed="false">◇ Избранное</button><label>Раздел<select id="galleryCategoryFilter"><option value="">Все работы</option><option>Аниме</option><option>Арт</option><option>Игры</option><option>Скриншоты</option><option>Другое</option></select></label><label>Поиск<input id="gallerySearch" type="search" placeholder="Название или автор"></label></div><div id="galleryList" class="gallery-grid"><p class="muted">Загружаем галерею…</p></div><dialog class="gallery-dialog" id="galleryDialog" aria-label="Просмотр работы"><button type="button" class="gallery-dialog-close" aria-label="Закрыть">×</button><img id="galleryDialogImage" alt=""><div class="gallery-dialog-copy"><strong id="galleryDialogTitle"></strong><span id="galleryDialogMeta"></span><p id="galleryDialogDescription"></p><div class="gallery-dialog-actions"><button class="small-button" data-gallery-report type="button">Пожаловаться</button></div><section class="gallery-comments"><h3>Обсуждение</h3><div id="galleryCommentsList" class="gallery-comments-list"></div><form id="galleryCommentForm"><label class="sr-only" for="galleryCommentBody">Комментарий</label><textarea id="galleryCommentBody" name="body" maxlength="500" rows="2" required placeholder="Напиши комментарий…"></textarea><button class="small-button" type="submit">Отправить</button><span id="galleryCommentMessage" class="form-message" role="status"></span></form></section></div></dialog><form id="galleryForm" class="application-form gallery-submit"><label>Название работы<input name="title" required maxlength="100" placeholder="Например, Лилия в полночь"></label><label>Раздел<select name="category" required><option>Аниме</option><option>Арт</option><option>Игры</option><option>Скриншоты</option><option>Другое</option></select></label><label class="form-wide">Картинка (JPG, PNG, WEBP или GIF, до 5 МБ)<input name="image" required type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><label class="form-wide">Описание<textarea name="description" maxlength="500" rows="2" placeholder="Коротко о работе"></textarea></label><div class="form-wide form-submit"><button class="button button-light" type="submit">Отправить на модерацию</button><p id="galleryMessage" class="form-message" role="status">Войти через Discord нужно для публикации.</p></div></form></main><div id="siteFooter"></div></body></html>
